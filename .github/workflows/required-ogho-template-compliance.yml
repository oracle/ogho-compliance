name: Required OGHO template compliance

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository template
    if: github.repository != 'oracle-samples/ogho-compliance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v7

      - name: Run OGHO template checks
        uses: oracle-samples/ogho-compliance/.github/actions/ogho-template-check@1e9ab2364a91e952a787b581617d5628af968893
        with:
          contributing-policy: required
